<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediScan Pro Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 text-white">

<div class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="w-64 bg-black/40 backdrop-blur-xl p-5 hidden md:block">
    <h1 class="text-2xl font-bold mb-8">🧬 MediScan</h1>
    <nav class="space-y-4">
      <button onclick="show('dashboard')" class="block w-full text-left hover:text-blue-400">Dashboard</button>
      <button onclick="show('patients')" class="block w-full text-left hover:text-blue-400">Patients</button>
      <button onclick="show('tests')" class="block w-full text-left hover:text-blue-400">Tests</button>
    </nav>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-6">

    <!-- Topbar -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-semibold">Admin Dashboard</h2>
      <span class="text-sm text-gray-400">Welcome, Admin</span>
    </div>

    <!-- Dashboard Cards -->
    <div id="dashboard" class="grid md:grid-cols-3 gap-6">
      <div class="bg-white/10 backdrop-blur-xl p-5 rounded-2xl shadow">
        <h3>Total Patients</h3>
        <p class="text-3xl font-bold" id="patientCount">0</p>
      </div>
      <div class="bg-white/10 backdrop-blur-xl p-5 rounded-2xl shadow">
        <h3>Total Tests</h3>
        <p class="text-3xl font-bold" id="testCount">0</p>
      </div>
      <div class="bg-white/10 backdrop-blur-xl p-5 rounded-2xl shadow">
        <h3>Revenue</h3>
        <p class="text-3xl font-bold">৳0</p>
      </div>

      <div class="col-span-3 bg-white/10 p-5 rounded-2xl">
        <canvas id="chart"></canvas>
      </div>
    </div>

    <!-- Patients -->
    <div id="patients" class="hidden">
      <h2 class="text-xl mb-4">Patients</h2>
      <input id="pName" placeholder="Name" class="p-2 text-black" />
      <input id="pAge" placeholder="Age" class="p-2 text-black" />
      <button onclick="addPatient()" class="bg-blue-500 px-4 py-2 rounded">Add</button>
      <ul id="pList" class="mt-4"></ul>
    </div>

    <!-- Tests -->
    <div id="tests" class="hidden">
      <h2 class="text-xl mb-4">Tests</h2>
      <input id="tName" placeholder="Test" class="p-2 text-black" />
      <input id="tPrice" placeholder="Price" class="p-2 text-black" />
      <button onclick="addTest()" class="bg-green-500 px-4 py-2 rounded">Add</button>
      <ul id="tList" class="mt-4"></ul>
    </div>

  </main>
</div>

<script>
function show(id){
  ['dashboard','patients','tests'].forEach(s=>document.getElementById(s).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// Dummy advanced data
let patients = [];
let tests = [];

function addPatient(){
  let name = pName.value;
  let age = pAge.value;
  patients.push({name,age});
  renderPatients();
}

function renderPatients(){
  pList.innerHTML='';
  patients.forEach(p=>{
    let li=document.createElement('li');
    li.innerText=p.name+' ('+p.age+')';
    pList.appendChild(li);
  })
  patientCount.innerText=patients.length;
  renderChart();
}

function addTest(){
  let name=tName.value;
  let price=tPrice.value;
  tests.push({name,price});
  renderTests();
}

function renderTests(){
  tList.innerHTML='';
  tests.forEach(t=>{
    let li=document.createElement('li');
    li.innerText=t.name+' - '+t.price;
    tList.appendChild(li);
  })
  testCount.innerText=tests.length;
}

function renderChart(){
  new Chart(document.getElementById('chart'),{
    type:'line',
    data:{labels:['Patients'],datasets:[{data:[patients.length]}]}
  })
}
</script>

</body>
</html>
